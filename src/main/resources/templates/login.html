<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - CCTV Home Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #111; color: #eee; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; width: 340px; }
    </style>
</head>
<body>

<div class="login-card p-4">
    <h1 class="h5 text-center mb-4">CCTV Home Server</h1>

    <div class="alert alert-danger py-2 small" th:if="${param.error}">Username atau password salah</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small text-secondary">Username</label>
            <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required autofocus/>
        </div>
        <div class="mb-3">
            <label class="form-label small text-secondary">Password</label>
            <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Masuk</button>
    </form>
</div>

</body>
</html>
