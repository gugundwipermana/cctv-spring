<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - CCTV Home Server</title>
    <style>
        body {
            font-family: system-ui, sans-serif; background: #111; color: #eee;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .login-box {
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            padding: 32px; width: 300px;
        }
        h1 { font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #aaa; }
        input {
            width: 100%; padding: 8px; margin-bottom: 14px; border-radius: 4px;
            border: 1px solid #444; background: #222; color: #eee; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 10px; background: #2563eb; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem;
        }
        button:hover { background: #1d4ed8; }
        .error { color: #f66; font-size: 0.85rem; margin-bottom: 12px; text-align: center; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>CCTV Home Server</h1>

    <p class="error" th:if="${param.error}">Username atau password salah</p>

    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input type="text" name="username" required autofocus/>

        <label>Password</label>
        <input type="password" name="password" required/>

        <button type="submit">Masuk</button>
    </form>
</div>
</body>
</html>
