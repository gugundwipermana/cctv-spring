<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Known Face</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111; color: #eee; }
        .panel { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; }
        a.person-item { background: #1a1a1a; color: #eee; border-color: #333; }
        a.person-item.active { background: #2563eb; border-color: #2563eb; }
        .photo-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; }
        .photo-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px 6px 0 0; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4" style="max-width: 1500px;">
    <div class="row g-3">
        <div class="col-md-4">
            <div class="panel p-3 mb-3">
                <h6 class="mb-3">Tambah Orang Baru</h6>
                <form th:action="@{/known-faces}" method="post" enctype="multipart/form-data">
                    <input type="text" name="name" class="form-control bg-dark text-light border-secondary mb-2"
                           placeholder="Nama" required/>
                    <input type="file" name="files" class="form-control bg-dark text-light border-secondary mb-2"
                           multiple accept="image/*"/>
                    <button type="submit" class="btn btn-primary btn-sm w-100">Daftarkan</button>
                </form>
            </div>

            <div class="panel p-2">
                <div class="list-group list-group-flush">
                    <a th:each="p : ${people}"
                       th:href="@{'/known-faces/' + ${p.id}}"
                       class="list-group-item person-item"
                       th:classappend="${selected != null and selected.id == p.id} ? 'active' : ''"
                       th:text="${p.name}">Nama</a>
                </div>
                <p class="text-secondary small p-2 mb-0" th:if="${people.isEmpty()}">Belum ada orang terdaftar.</p>
            </div>
        </div>

        <div class="col-md-8">
            <div th:if="${selected == null}" class="panel p-4 text-secondary">
                Pilih salah satu orang di panel kiri untuk lihat foto & embedding-nya.
            </div>

            <div th:if="${selected != null}">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h5 class="mb-0" th:text="${selected.name}">Nama</h5>
                </div>

                <div class="panel p-3 mb-3">
                    <h6 class="mb-2">Tambah Foto</h6>
                    <form th:action="@{'/known-faces/' + ${selected.id} + '/photos'}" method="post"
                          enctype="multipart/form-data" class="d-flex gap-2">
                        <input type="file" name="files" class="form-control bg-dark text-light border-secondary"
                               multiple accept="image/*" required/>
                        <button type="submit" class="btn btn-primary btn-sm">Upload</button>
                    </form>
                </div>

                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-2">
                    <div class="col" th:each="photo : ${photos}">
                        <div class="photo-card">
                            <img th:if="${photo.imagePath != null}"
                                 th:src="@{'/media/known_faces/' + ${photo.imagePath}}" alt="foto"/>
                            <div class="p-2">
                                <div class="small text-secondary mb-2" th:text="${photo.createdAt}">2026-08-04</div>
                                <form th:action="@{'/known-faces/' + ${selected.id} + '/photos/' + ${photo.id} + '/delete'}"
                                      method="post"
                                      onsubmit="return confirm('Hapus foto ini?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm w-100">Hapus</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="text-secondary small" th:if="${photos.isEmpty()}">Belum ada foto untuk orang ini.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
