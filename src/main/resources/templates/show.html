<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'CCTV - ' + ${date}">CCTV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111; color: #eee; }
        .rec-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; height: 100%; }
        .rec-card .card-header { background: #202020; border-bottom: 1px solid #333; }
        video { width: 100%; border-radius: 6px; background: #000; }
        .badge-known { background: #1a3a5c; color: #9cf; }
        .badge-unknown { background: #5c1a1a; color: #f99; }
        .thumbs img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; border: 1px solid #444; margin: 2px; }
        .gallery-content { margin-top: 8px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4" style="max-width: 1600px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h4 mb-0" th:text="'Rekaman tanggal ' + ${date}">Rekaman</h1>
        <a href="/" class="btn btn-outline-light btn-sm">&larr; Kembali</a>
    </div>

    <p class="text-secondary" th:if="${rows.isEmpty()}">Tidak ada rekaman untuk tanggal ini.</p>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 row-cols-xxl-4 g-3">
        <div class="col" th:each="row : ${rows}">
            <div class="rec-card p-0">
                <div class="card-header d-flex align-items-center justify-content-between px-3 py-2">
                    <span class="fw-semibold">
                        <span th:text="${row.cameraId()}">cam1</span> &middot;
                        <span th:text="${#numbers.formatInteger(row.hour(), 2)} + ':00'">02:00</span>
                    </span>
                    <span class="badge"
                          th:classappend="${row.status() == 'COMPILED'} ? 'bg-success' : 'bg-warning text-dark'"
                          th:text="${row.status()}">COMPILED</span>
                </div>

                <div class="p-3">
                    <div class="d-flex gap-2 mb-2">
                        <span class="badge badge-known" th:text="${row.knownFaceCount()} + ' dikenal'">2 dikenal</span>
                        <span class="badge badge-unknown" th:text="${row.unknownFaceCount()} + ' tidak dikenal'">1 tidak dikenal</span>
                    </div>

                    <p class="small text-info mb-2" th:if="${!row.namesDetected().isEmpty()}">
                        <span th:text="${#strings.listJoin(row.namesDetected(), ', ')}">Gugun</span>
                    </p>

                    <video th:if="${row.videoPath() != null}" controls
                           th:src="@{'/media/recordings/' + ${row.videoPath()}}">
                    </video>
                    <p th:if="${row.videoPath() == null}" class="text-secondary small mb-0">
                        Masih berjalan / belum di-compile.
                    </p>

                    <div th:if="${!row.unknownFaces().isEmpty()}" class="mt-2">
                        <button type="button"
                                class="btn btn-sm btn-outline-danger w-100"
                                th:attr="data-target='gallery-' + ${row.cameraId()} + '-' + ${row.hour()}"
                                onclick="toggleGallery(this.dataset.target)">
                            Tampilkan <span th:text="${row.unknownFaceCount()}">1</span> wajah tidak dikenal
                        </button>

                        <div th:id="'gallery-' + ${row.cameraId()} + '-' + ${row.hour()}"
                             class="gallery-content" style="display:none;">
                            <div th:each="uf : ${row.unknownFaces()}" class="mb-2 p-2 border border-secondary rounded">
                                <div class="small text-secondary mb-1">
                                    #<span th:text="${uf.id()}">12</span> &middot;
                                    <span th:text="${uf.detectionCount()}">8</span>x &middot;
                                    <span th:text="${uf.firstSeen()} + '-' + ${uf.lastSeen()}">14:05-14:40</span>
                                </div>
                                <div class="thumbs">
                                    <img th:each="path : ${uf.imagePaths()}"
                                         th:src="@{'/media/unknown_faces/' + ${path}}"
                                         alt="wajah tidak dikenal"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleGallery(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
</script>
</body>
</html>
