<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Wajah Tidak Dikenal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111; color: #eee; }
        .uf-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; }
        .thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid #444; margin-right: 4px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4" style="max-width: 1400px;">
    <h1 class="h4 mb-4">Daftar Wajah Tidak Dikenal</h1>

    <p class="text-secondary" th:if="${rows.isEmpty()}">Belum ada wajah tidak dikenal yang tercatat.</p>

    <div class="uf-card p-3 mb-3 d-flex align-items-center justify-content-between flex-wrap gap-3"
         th:each="row : ${rows}">
        <div class="thumbs d-flex">
            <img th:each="path : ${row.imagePaths()}"
                 th:src="@{'/media/unknown_faces/' + ${path}}"
                 alt="wajah tidak dikenal"/>
        </div>

        <div class="flex-grow-1 small text-secondary">
            Wajah #<span th:text="${row.id()}">12</span> &middot;
            muncul <span th:text="${row.detectionCount()}">8</span>x
            <br/>
            <span th:text="${row.firstSeen()}">2026-08-04T02:05</span> &rarr;
            <span th:text="${row.lastSeen()}">2026-08-04T02:40</span>
        </div>

        <form th:action="@{'/unknown-faces/' + ${row.id()} + '/delete'}" method="post"
              onsubmit="return confirm('Hapus wajah ini beserta semua gambarnya? Tindakan ini tidak bisa dibatalkan.');">
            <button type="submit" class="btn btn-outline-danger btn-sm">Hapus</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
