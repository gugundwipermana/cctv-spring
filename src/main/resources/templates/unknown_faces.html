<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Wajah Tidak Dikenal</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
        a.back { color: #6cf; text-decoration: none; }
        .card {
            border: 1px solid #333; border-radius: 8px; padding: 12px 16px; margin: 12px 0;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }
        .card .info { flex: 1; }
        .card .meta { font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
        .thumbs { display: flex; gap: 4px; flex-wrap: wrap; }
        .thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid #444; }
        .delete-btn {
            background: #5c1a1a; color: #f99; border: 1px solid #833; border-radius: 6px;
            padding: 8px 14px; cursor: pointer; font-size: 0.85rem; white-space: nowrap;
        }
        .delete-btn:hover { background: #722; }
        .empty { color: #888; }
    </style>
</head>
<body>
<a class="back" href="/">&larr; Kembali</a>
<h1>Daftar Wajah Tidak Dikenal</h1>

<p class="empty" th:if="${rows.isEmpty()}">Belum ada wajah tidak dikenal yang tercatat.</p>

<div class="card" th:each="row : ${rows}">
    <div class="thumbs">
        <img th:each="path : ${row.imagePaths()}"
             th:src="@{'/media/unknown_faces/' + ${path}}"
             alt="wajah tidak dikenal"/>
    </div>
    <div class="info">
        <div class="meta">
            Wajah #<span th:text="${row.id()}">12</span>
            &middot; muncul <span th:text="${row.detectionCount()}">8</span>x
            <br/>
            Pertama: <span th:text="${row.firstSeen()}">2026-08-04T02:05</span>
            <br/>
            Terakhir: <span th:text="${row.lastSeen()}">2026-08-04T02:40</span>
        </div>
    </div>
    <form th:action="@{'/unknown-faces/' + ${row.id()} + '/delete'}" method="post"
          onsubmit="return confirm('Hapus wajah ini beserta semua gambarnya? Tindakan ini tidak bisa dibatalkan.');">
        <button type="submit" class="delete-btn">Hapus</button>
    </form>
</div>
</body>
</html>
