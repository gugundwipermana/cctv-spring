<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CCTV Home Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111; color: #eee; }
        .card { background: #1a1a1a; border-color: #333; }
        a.list-group-item { background: #1a1a1a; color: #9cf; border-color: #333; }
        a.list-group-item:hover { background: #222; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4" style="max-width: 1400px;">
    <h1 class="h4 mb-4">Daftar Tanggal Rekaman</h1>

    <p class="text-secondary" th:if="${dates.isEmpty()}">Belum ada rekaman.</p>

    <div class="list-group" style="max-width: 400px;">
        <a th:each="d : ${dates}"
           th:href="@{'/recordings/' + ${d}}"
           class="list-group-item list-group-item-action"
           th:text="${d}">2026-08-04</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
