spring.application.name=cctv-spring

server.port=8080

# Datasource - nilai default untuk dev lokal, akan di-override oleh
# environment variable dari docker-compose.yml saat jalan di container.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cctv_spring_db}
spring.datasource.username=${DB_USER:cctv_spring_user}
spring.datasource.password=${DB_PASSWORD:cctv_spring_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update dipakai supaya di tahap belajar ini Hibernate otomatis
# bikin/update tabel dari entity Java, tanpa perlu tulis migration SQL
# manual dulu. Kalau nanti project makin serius, sebaiknya ganti ke
# 'validate' dan pakai tool migration seperti Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Batas ukuran file upload (frame JPEG biasanya kecil, tapi kasih ruang lebih)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB

# ============ Konfigurasi khusus CCTV (setara .env.docker di Laravel) ============

# Folder DASAR tempat semua data (frame mentah + video hasil compile) disimpan
# DI DALAM container. Isinya nanti punya 2 subfolder: frames/ dan recordings/.
# Path host-nya diatur lewat docker-compose.yml + .env (lihat README).
cctv.storage.path=${CCTV_STORAGE_PATH:/data/storage}

# URL Python face-service (stateless, deteksi wajah + embedding)
cctv.face-service.url=${FACE_SERVICE_URL:http://localhost:8500}

# Ambang cosine similarity untuk dianggap "cocok" - setara FACE_MATCH_THRESHOLD di Laravel
cctv.face-match-threshold=${FACE_MATCH_THRESHOLD:0.45}

# FPS video hasil compile - setara FRAME_OUTPUT_FPS di Laravel
cctv.frame-output-fps=${FRAME_OUTPUT_FPS:10}

# Simpan frame mentah setelah berhasil di-compile jadi video atau tidak - setara KEEP_FRAMES_AFTER_COMPILE
cctv.keep-frames-after-compile=${KEEP_FRAMES_AFTER_COMPILE:false}

# Retensi hari untuk cleanup harian - setara --days=7 di recordings:cleanup
cctv.retention-days=${RETENTION_DAYS:7}

# ============ Konfigurasi Unknown Face Clustering ============

# Ambang consine similarity untuk anggap wajah unknown ini "orang yang sama"
# dengan identitas unknown yang sudah tercatat. Beda dari cctv.face-match-threshold
# (itu untuk match ke known_faces yang terdaptar).
cctv.unknown-face.similarity-threshold=${UNKNOWN_FACE_SIMILARITY_THRESHOLD:0.4}

# Maksimal jumlah foto yang disimpan per identitas unknown
cctv.unknown-face.max-images-per-face=${UNKNOWN_FACE_MAX_IMAGES:5}

# Retensi hari sebelum identitas unknown yang jarang muncul dihapus
cctv.unknown-face.retention-days=${UNKNOWN_FACE_RETENTION_DAYS:10}

# Minimal detection_coun tagar identitas unknown TIDAK dihapus saat cleanup
# (di bawah angka ini dianggap "Numpang lewat", aman dihapus)
cctv.unknown-face.min-detection-count-to-keep=${UNKNOWN_FACE_MIN_DETECTION_COUNT:3}

# Wajah dengan det_score di bawah ini diabaikan sepenuhnya (tidak dicoba
# matching, tidak dibuat jadi unknown face). Perlu di-tuning: mulai dari
# 0.75, naikkan kalau masih banyak unknown blur, turunkan kalau wajah asli
# malah ikut terbuang.
cctv.face-quality.min-det-score=${FACE_MIN_DET_SCORE:0.75}

# Authentication untuk akses web admin (username/password) dan API key untuk akses API (ESP32, curl, dsb)
cctv.admin.username=${CCTV_ADMIN_USERNAME:admin}
cctv.admin.password=${CCTV_ADMIN_PASSWORD:}
cctv.api-key=${CCTV_API_KEY:}